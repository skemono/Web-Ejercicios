<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replica Cerdo Angry Birds</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <!-- Imagen original -->
        <img src="assets/smallpig.png" alt="Cerdo Verde Original" class="original-image">
        
        <!-- Réplica del cerdo -->
        <div class="pig-replica">
            <div class="head">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="eyes">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>
                <div class="nose">
                    <div class="nostril left"></div>
                    <div class="nostril right"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
